name: release-builds

on:
  pull_request:
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'robot/**/*.robot'
      - 'scripts/websocket-close-frame-test.py'
      - '.github/workflows/**'
  push:
    branches:
      - main

env:
  CTEST_NO_TESTS_ACTION: error
  CTEST_OUTPUT_ON_FAILURE: ON

jobs:
  gcc-14:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake g++-14 git libssl-dev ninja-build python3 python3-pip
      - uses: actions/checkout@v5
      - name: Install Robot dependencies
        run: python3 -m pip install --break-system-packages -r robot/dependencies.txt
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -D CMAKE_CXX_COMPILER=g++-14 \
            -C .ci/linux/release.cmake
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build

  debian-12: # EOL June 2028
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-debian-12:latest
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -C .ci/linux/release.cmake
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build

  fedora-42: # EOL May 2026
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-fedora-42:latest
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -C .ci/linux/release.cmake
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build

  cpp23-with-std-expected: # EOL May 2026
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-fedora-42:latest
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -D CAF_CXX_VERSION=23 \
            -D CAF_USE_STD_EXPECTED=ON \
            -C .ci/linux/release.cmake
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build

  no-exceptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install-robot
        run:  pip install -r robot/dependencies.txt
      - name: configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -C .ci/linux/no-exceptions.cmake
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build

  no-rtti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install-robot
        run:  pip install -r robot/dependencies.txt
      - name: configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -C .ci/linux/no-rtti.cmake
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build

